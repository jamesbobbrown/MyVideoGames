services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myvideogames-backend
    ports:
      - "5062:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myvideogames-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend