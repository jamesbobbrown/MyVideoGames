<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - My Video Game List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">🎮 MyVideoGameList</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="library.html">My Lists</a>
      <a href="news.html">News</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p>Login to access your lists, favourites and achievements.</p>

        <form id="loginForm" class="auth-form">
          <input type="text" id="loginUsername" placeholder="Username" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>

        <p id="loginMessage" class="message"></p>
      </div>

      <div class="auth-card">
        <h1>Create account</h1>
        <p>Start tracking your games and build your profile.</p>

        <form id="registerForm" class="auth-form">
          <input type="text" id="registerUsername" placeholder="Username" required />
          <input type="email" id="registerEmail" placeholder="Email" required />
          <input type="password" id="registerPassword" placeholder="Password" required />
          <button type="submit" class="btn btn-secondary full-width">Register</button>
        </form>

        <p id="registerMessage" class="message"></p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
